[project]
name = "aurum"
version = "0.0.1"
description = "Research and automated-trading platform for intraday XAUUSD on MetaTrader 5 (demo only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Andrei Neagoe" }]
# Sprint 1 subset only. Data stack (polars, pyarrow, duckdb, numpy, pandas) arrives in Phase 2
# when it is first used; ML/dashboard libraries much later.
dependencies = [
    "pydantic>=2.8",          # domain models + config validation
    "pydantic-settings>=2.4", # .env / environment loading
    "pyyaml>=6.0",            # configs/*.yaml
    "typer>=0.12",            # CLI
    "rich>=13.7",             # CLI output
    "structlog>=24.1",        # JSON structured logs
    "tzdata>=2024.1",         # IANA tz database for zoneinfo on Windows (no system tzdb there)
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.scripts]
aurum = "aurum.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurum"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "C4", "PIE", "RET", "TID",
    "DTZ", # flake8-datetimez: bans naive datetimes (project rule: everything tz-aware UTC)
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["aurum", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["MetaTrader5", "MetaTrader5.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
pythonpath = ["."]
markers = [
    "mt5: needs Windows, the MetaTrader5 package and a running MT5 terminal (auto-skipped elsewhere)",
    "mt5_orders: sends DEMO orders; also needs AURUM_MT5_ORDER_TESTS=1 (auto-skipped otherwise)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["aurum"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
