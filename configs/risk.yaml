# Provisional demo safety controls. NOT optimised and never tuned for performance.
risk_per_trade_pct: 0.25          # % of equity risked between entry and stop
max_open_positions: 1
max_trades_per_day: 3
daily_loss_limit_pct: 1.0
weekly_loss_limit_pct: 2.5
consecutive_loss_cooldown: 2      # this many consecutive losses -> locked out for rest of session
# p99 of the spread at M5 decision instants on exact tick days 2026-06-26..10-08, rounded up
# to 5 (reports/phase_2.md §5; blocks ~0.8% of normal decisions and the US-release spikes).
# Re-derive from collector data after one month of live capture (`aurum data spreads`).
max_spread_points: 20
max_spread_atr_fraction: 0.15     # spread vs M15 ATR
min_minutes_before_cutoff: 45     # no new entries within this many minutes of force_flat_at
stale_quote_seconds: 10

# No new entries around high-impact US releases (owner decision 2026-10-09). Open positions
# keep their broker-side stops. Times are New York wall clock, so DST follows the US.
news_blackout:
  timezone: America/New_York
  daily_windows:  # every Monday-Friday
    - {start: "08:20", end: "08:45", reason: "08:30 ET releases: NFP, CPI, PPI, retail sales, GDP, jobless claims"}
    - {start: "09:50", end: "10:15", reason: "10:00 ET releases: ISM, JOLTS, consumer sentiment, home sales"}
  fomc_window: {start: "13:30", end: "15:00", reason: "FOMC statement 14:00 ET and press conference 14:30 ET"}
  # Statement dates (last day of each meeting), verified 2026-10-09 on
  # federalreserve.gov/monetarypolicy/fomccalendars.htm and fomchistorical2020.htm. All scheduled;
  # no unscheduled decisions in range. SEP = Summary of Economic Projections released.
  # Add each new year's dates as soon as the Fed publishes them.
