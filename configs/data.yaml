# Data foundation (Phase 2): market hours, backfill, live collector and data QA.
# Clock times are quoted "HH:MM" in the stated timezone. Dates are YYYY-MM-DD.

# XAUUSD trading hours at Fusion, measured from ticks (reports/phase_2.md): the market opens at
# 18:00 New York (Sunday to Thursday), the last tick of the day is at 16:58:5x, and it is closed
# 16:59-18:00 New York every day (= server 23:59-01:00, ADR-0004) and from Friday 16:59 to
# Sunday 18:00. A trading date D runs from 18:00 New York on D-1 to 16:59 on D.
market:
  timezone: America/New_York
  open: "18:00"
  close: "16:59"
  # The first tick after an open can arrive this late (measured: up to 18:01:00).
  open_grace_minutes: 2
  # Weekday trading dates with no trading at all, and trading dates that end early (close =
  # New York time of the first minute without a bar). Measured from the broker's M1 history
  # by `aurum data qa` and matched to the US exchange-holiday calendar (reports/phase_2.md).
  # Anything missing that is not listed here is an unexplained gap in data QA. Extend this
  # list for future holidays before they happen (Phase 4 force-flat depends on it).
