backfill:
  # Measured depth (reports/phase_2.md §1): continuous M1..H1 bars since 2020-11-12, ticks
  # since 2026-03-29 22:00 UTC. Earlier bars are one placeholder per day, not history.
  bars_from: 2020-11-12
  ticks_from: 2026-03-29
  timeframes: [M1, M5, M15, H1]
  # Bars are requested in windows of this many days and stored one file per UTC day.
  bar_chunk_days: 31
  # A weekday that returns no ticks/bars is asked again this often before it is stored empty.
  empty_retries: 3
  retry_seconds: 2.0

collector:
  poll_seconds: 1.0             # how often new ticks are requested from the terminal
  flush_seconds: 300            # buffered ticks are written at least this often
  heartbeat_seconds: 60         # heartbeat file + log line
  gap_record_seconds: 60        # tick gaps longer than this while the market is open are recorded
  settle_seconds: 5             # wait after a (re)connect so the terminal can sync history
  pause_detect_seconds: 30      # a loop iteration this late means the VM slept or froze
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 300

qa:
  # A tick whose spread exceeds this multiple of its UTC day's median spread is an outlier.
  spread_outlier_factor: 5.0
  # A minute whose mean spread exceeds this multiple of its session's median is a spike.
  spread_spike_factor: 3.0
  # Gaps inside the trading sessions that are in the broker's own history (its M1/M5/M15/H1
  # bars have no data there either, and canonical bars miss nothing the broker has). Each one
  # is listed explicitly so it is visible, not absorbed by a tolerance. UTC, end exclusive.
  known_gaps:
    - start: "2024-02-14T14:41:00Z"
      end: "2024-02-14T14:42:00Z"
      reason: "1 minute without any bar in the broker's history; cause unknown"
    - start: "2025-02-28T09:53:00Z"
      end: "2025-02-28T09:55:00Z"
      reason: "2 minutes without any bar in the broker's history; cause unknown"
    - start: "2025-07-02T13:37:00Z"
      end: "2025-07-02T13:39:00Z"
      reason: "2 minutes without any bar in the broker's history; cause unknown"
    - start: "2025-11-28T08:04:00Z"
      end: "2025-11-28T09:43:00Z"
      reason: >-
        Sparse feed (9 gaps, 70 of 99 minutes without a bar) on the day of the CME Globex
        outage of 2025-11-28 (day after Thanksgiving); the broker's history has no bars either
    - start: "2026-02-11T13:34:00Z"
      end: "2026-02-11T13:38:00Z"
      reason: >-
        No quotes for 4 minutes starting 08:34 New York, just after the usual 08:30 US data
        release time; the broker's history has no bars either
