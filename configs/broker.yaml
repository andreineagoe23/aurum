# Fusion Markets MT5 "Zero" account (raw spread + commission). DEMO ONLY.
# Live gating lives in promotion.yaml + environment, never here.
name: fusion_markets_zero
account_type: zero
# The demo account is USD. An explicit code makes connecting to an account in any other
# currency an error (`auto` would accept whatever the connected account reports).
account_currency: USD

# The broker's exact gold symbol is discovered at runtime (`aurum mt5 symbols --find gold`).
# Candidates are tried in order; the first one the terminal knows wins.
symbol_candidates: [XAUUSD, XAUUSD., XAUUSD.r, XAUUSD+, GOLD]
symbol_search_terms: [XAU, GOLD]

commission:
  # $4.50 per 1.0 lot round trip == $2.25 per side, charged in USD terms and booked by the
  # broker in the account currency.
  # MEASURED 2026-10-09 on demo 504691 (USD): position 573971612, 1.00 lot XAUUSD, sell deal
  # 403504311 (16:10:20 UTC, commission -2.25) and buy deal 403504789 (16:11:30 UTC,
  # commission -2.25); fee 0, swap 0. Equals the advertised rate. Each deal's commission is
  # rounded to cents (a 0.01-lot round trip booked -0.02 per side, not -0.0225).
  per_lot_per_side: 2.25
  currency: USD

# PROVISIONAL. Recalibrated from demo fills in Phase 8. Points = symbol `point` units.
slippage:
  model: fixed_points
  points_per_side: 5

# MT5 server clock = New York wall clock + 7h (measured in Phase 1, ADR-0004).
server_time:
  timezone: America/New_York
  shift_hours: 7

# Stamped on every Aurum order (MT5 `magic`) so reconciliation can tell our orders apart.
magic_number: 7020261
# Market orders: reject the fill if price moved more than this many points (50 = $0.50).
max_deviation_points: 50
# An OrderIntent older than this is never sent (owner, Phase 4): re-decide after a disconnect.
max_intent_age_seconds: 60
